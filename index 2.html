const MAX_LEN = 10;
const DATA_COUNT = DICE_DATA.length;
const HL_DATA = DICE_DATA.map(v => v >= 50 ? 'H' : 'L');
const RANGE_DATA = DICE_DATA.map(v => Math.min(9, Math.floor(v / 10)));
const HL_MAPS = Array.from({length: MAX_LEN + 1}, () => new Map());
const RANGE_MAPS = Array.from({length: MAX_LEN + 1}, () => new Map());
function addCount(map, key, next){
  let a = map.get(key);
  if(!a){ a = [0,0]; map.set(key,a); }
  if(next === 'H') a[0]++; else a[1]++;
}
function buildMaps(){
  for(let len=1; len<=MAX_LEN; len++){
    for(let i=0; i<=DATA_COUNT-len-1; i++){
      addCount(HL_MAPS[len], HL_DATA.slice(i,i+len).join(''), HL_DATA[i+len]);
      addCount(RANGE_MAPS[len], RANGE_DATA.slice(i,i+len).join('-'), HL_DATA[i+len]);
    }
  }
}
buildMaps();
function fmtPct(n){ return isFinite(n) ? n.toFixed(2)+'%' : '0.00%'; }
function fmtNum(n){ return Number(n).toLocaleString('ko-KR'); }
function parseNums(s){ return (s.match(/\d+(?:\.\d+)?/g)||[]).map(x=>Math.max(0,Math.min(99,parseInt(Number(x))))); }
function classifySample(total){ if(total>=1000) return '높음'; if(total>=200) return '보통'; if(total>=50) return '낮음'; if(total>0) return '매우 낮음'; return '없음'; }
function rowsFromMap(maps, patternArr, type){
  const max=Math.min(MAX_LEN, patternArr.length); const rows=[];
  for(let len=1; len<=max; len++){
    const p=patternArr.slice(patternArr.length-len);
    const key = type==='hl' ? p.join('') : p.join('-');
    const c = maps[len].get(key) || [0,0];
    const total=c[0]+c[1];
    rows.push({len, pattern:type==='hl'?p.join(' '):p.map(x=>x*10+'대').join(' → '), h:c[0], l:c[1], total, hp: total?c[0]/total*100:0, lp: total?c[1]/total*100:0, conf:classifySample(total)});
  }
  return rows;
}
function bestRow(rows){
  const avail=rows.filter(r=>r.total>0);
  if(!avail.length) return null;
  return avail.sort((a,b)=> b.len-a.len || b.total-a.total)[0];
}
function bar(hp,lp){ return `<div class="bar"><div class="barH" style="width:${hp}%"></div><div class="barL" style="width:${lp}%"></div></div>`; }
function tableRows(rows){
  return `<table><thead><tr><th>길이</th><th>패턴</th><th>표본</th><th>H</th><th>L</th><th>신뢰</th></tr></thead><tbody>`+
    rows.map(r=>`<tr><td>${r.len}</td><td>${r.pattern}</td><td>${fmtNum(r.total)}</td><td>${fmtPct(r.hp)}</td><td>${fmtPct(r.lp)}</td><td>${r.conf}</td></tr>`).join('')+`</tbody></table>`;
}
function patternCard(title,best,rows,kind){
  if(!best) return `<div class="title"><h2>${title}</h2><span class="badge">데이터 없음</span></div><p class="muted">입력한 패턴과 일치하는 과거 데이터가 없어.</p>${tableRows(rows)}`;
  const rec = best.hp>=best.lp ? 'H' : 'L'; const cls=rec==='H'?'recH':'recL';
  return `<div class="title"><h2>${title}</h2><span class="badge">${best.len}개 패턴</span></div>
  <div class="muted">패턴: ${best.pattern}</div>
  ${bar(best.hp,best.lp)}
  <div class="resultline"><span>다음 H</span><b class="recH">${fmtNum(best.h)}회 / ${fmtPct(best.hp)}</b></div>
  <div class="resultline"><span>다음 L</span><b class="recL">${fmtNum(best.l)}회 / ${fmtPct(best.lp)}</b></div>
  <div class="resultline"><span>표본 / 신뢰도</span><b>${fmtNum(best.total)}회 / ${best.conf}</b></div>
  <div class="resultline"><span>우세</span><b class="${cls}">${rec}</b></div>
  ${tableRows(rows)}`;
}
function nBias(n){
  n=Math.max(1,Math.min(DATA_COUNT,parseInt(n)||20)); const recent=HL_DATA.slice(DATA_COUNT-n); let h=0,l=0; for(const x of recent) x==='H'?h++:l++; const total=h+l; return {n,h,l,total,hp:h/total*100,lp:l/total*100};
}
function weightedSummary(hlBest, rangeBest, bias){
  let parts=[];
  function weight(r,base){ if(!r||!r.total) return 0; return base * Math.min(1, Math.log10(r.total+1)/3); }
  if(hlBest) parts.push({name:'H/L 패턴', hp:hlBest.hp, lp:hlBest.lp, w:weight(hlBest,1.15), sample:hlBest.total});
  if(rangeBest) parts.push({name:'구간패턴', hp:rangeBest.hp, lp:rangeBest.lp, w:weight(rangeBest,1.0), sample:rangeBest.total});
  parts.push({name:`최근 ${bias.n}회 편향`, hp:bias.hp, lp:bias.lp, w:0.75, sample:bias.total});
  let wh=0, wl=0, tw=0; for(const p of parts){ wh+=p.hp*p.w; wl+=p.lp*p.w; tw+=p.w; }
  const hp=tw?wh/tw:0, lp=tw?wl/tw:0, rec=hp>=lp?'H':'L', conf=Math.abs(hp-lp);
  return {parts,hp,lp,rec,conf};
}
function analyze(){
  const err=document.getElementById('error'); err.classList.add('hidden');
  const nums=parseNums(document.getElementById('nums').value);
  localStorage.setItem('dice_nums', document.getElementById('nums').value);
  localStorage.setItem('dice_n', document.getElementById('nval').value);
  if(nums.length<1){ err.textContent='최근 숫자를 1개 이상 입력해줘.'; err.classList.remove('hidden'); document.getElementById('output').classList.add('hidden'); return; }
  const inputHL=nums.map(v=>v>=50?'H':'L'); const inputRange=nums.map(v=>Math.min(9,Math.floor(v/10)));
  const hlRows=rowsFromMap(HL_MAPS,inputHL,'hl'); const rangeRows=rowsFromMap(RANGE_MAPS,inputRange,'range'); const hb=bestRow(hlRows); const rb=bestRow(rangeRows); const b=nBias(document.getElementById('nval').value); const sum=weightedSummary(hb,rb,b);
  document.getElementById('hlCard').innerHTML=patternCard('H/L 패턴 분석',hb,hlRows,'hl');
  document.getElementById('rangeCard').innerHTML=patternCard('구간 패턴 분석',rb,rangeRows,'range');
  document.getElementById('biasCard').innerHTML=`<div class="title"><h2>N회 편향 분석</h2><span class="badge">최근 ${fmtNum(b.n)}회</span></div>${bar(b.hp,b.lp)}<div class="resultline"><span>H</span><b class="recH">${fmtNum(b.h)}회 / ${fmtPct(b.hp)}</b></div><div class="resultline"><span>L</span><b class="recL">${fmtNum(b.l)}회 / ${fmtPct(b.lp)}</b></div><div class="resultline"><span>편향</span><b class="${b.hp>=b.lp?'recH':'recL'}">${b.hp>=b.lp?'H 우세':'L 우세'}</b></div>`;
  const cls=sum.rec==='H'?'recH':'recL';
  document.getElementById('summaryCard').innerHTML=`<div class="title"><h2>종합 추천</h2><span class="badge">3개 분석 종합</span></div><div class="big ${cls}">다음 추천: ${sum.rec}</div>${bar(sum.hp,sum.lp)}<div class="resultline"><span>종합 H</span><b class="recH">${fmtPct(sum.hp)}</b></div><div class="resultline"><span>종합 L</span><b class="recL">${fmtPct(sum.lp)}</b></div><div class="resultline"><span>차이값</span><b>${fmtPct(sum.conf)}</b></div><div class="small">차이값이 작거나 표본이 적으면 참고용으로만 봐줘. 카지노 결과는 독립시행이라 확정 예측은 아니야.</div>`;
  document.getElementById('output').classList.remove('hidden');
}
document.getElementById('analyzeBtn').addEventListener('click', analyze);
document.getElementById('nums').addEventListener('input', ()=>{ if(document.getElementById('nums').value.trim()) analyze(); });
document.getElementById('nval').addEventListener('input', ()=>{ if(document.getElementById('nums').value.trim()) analyze(); });
window.addEventListener('load',()=>{ const saved=localStorage.getItem('dice_nums'); const n=localStorage.getItem('dice_n'); if(saved) document.getElementById('nums').value=saved; if(n) document.getElementById('nval').value=n; if(saved) analyze(); });
